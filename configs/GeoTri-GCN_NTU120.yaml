gpus:
- 0
seed: 1
debug: false
pretrained_path: null
work_dir: ./outputs/GeoTri-GCN_NTU120
no_progress_bar: false
visualization_class: 0
visualization_sample: 0
visualization_frames: []
dataset: ntu-xsub120
dataset_args:
  ntu:
    train_batch_size: 16
    eval_batch_size: 16
    num_frame: 288
    inputs: JVB
    transform: false
    bone_aug_prob: 0.5
    bone_aug_range: 0.1
    root_folder: ./data/processed
    ntu60_path: ./data/raw/nturgb+d_skeletons
    ntu120_path: ./data/raw/nturgbd_skeletons_s018_to_s032
model_type: EfficientGCN-B0
model_args:
  stem_channel: 64
  block_args:
  - - 48
    - 1
    - 0.5
  - - 24
    - 1
    - 0.5
  - - 64
    - 2
    - 1
  - - 128
    - 2
    - 1
  fusion_stage: 2
  fusion_type: tri_axis
  fusion_temporal_kernel: 3
  temporal_refine: true
  temporal_refine_kernels:
  - 3
  - 5
  - 7
  temporal_refine_reduction: 4
  act_type: swish
  att_type: stja
  layer_type: SG
  drop_prob: 0.25
  kernel_size:
  - 5
  - 2
  scale_args:
  - 1.2
  - 1.35
  expand_ratio: 0
  reduct_ratio: 2
  bias: true
  edge: true
optimizer: SGD
optimizer_args:
  SGD:
    lr: 0.1
    momentum: 0.9
    nesterov: true
    weight_decay: 0.0001
  Adam:
    lr: 0.1
    betas:
    - 0.9
    - 0.99
    weight_decay: 0.0001
lr_scheduler: cosine
scheduler_args:
  step:
    max_epoch: 70
    warm_up: 10
    step_lr:
    - 20
    - 50
  cosine:
    max_epoch: 70
    warm_up: 10
